name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker build -t docker-fastapi:latest ./BE

      - name: Build Frontend Docker Image
        run: docker build -t docker-nextjs:latest ./FE

      - name: Run Backend Tests
        run: docker run --rm docker-fastapi:latest pytest tests/test_main.py -v

      - name: Run Frontend Build Check
        run: docker run --rm docker-nextjs:latest npm run build

      - name: Run Frontend Lint
        run: docker run --rm docker-nextjs:latest npm run lint
        continue-on-error: true

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-test
    # Deploy only on push events to main or master branch
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/app
            cd ~/app

            if [ -d ".git" ]; then
              git pull origin ${{ github.ref_name }}
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi

            docker compose down
            docker compose up -d --build
            docker image prune -f
            docker compose ps