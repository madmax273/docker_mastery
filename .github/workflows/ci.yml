name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t docker-fastapi:latest ./BE

      - name: Build Frontend Docker Image
        run: |
          docker build -t docker-nextjs:latest ./FE

      - name: Run Backend Tests
        run: |
          docker run --rm docker-fastapi:latest pytest tests/test_main.py -v

      - name: Run Frontend Build Check
        run: |
          docker run --rm docker-nextjs:latest npm run build

      - name: Run Frontend Lint
        run: |
          docker run --rm docker-nextjs:latest npm run lint
        continue-on-error: true

